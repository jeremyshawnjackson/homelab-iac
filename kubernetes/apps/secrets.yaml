# Every encrypted secret in the repository, in one Application behind the
# sops plugin. One place to look, and the plugin is named explicitly so it
# never claims a directory of ordinary manifests.
#
# The runtimes share a namespace because a PersistentVolumeClaim is namespaced:
# vLLM and llama.cpp read the same Hugging Face cache volume, which they could
# not do from different namespaces.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jeremyshawnjackson/homelab-iac.git
    targetRevision: main
    path: kubernetes/secrets
    plugin:
      name: sops
  destination:
    server: https://kubernetes.default.svc
    namespace: inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
