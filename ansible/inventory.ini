; Ansible runs on the mgmt VM, which is itself a managed host.

[bastion]
mgmt ansible_connection=local

[proxmox]
pve ansible_host=192.168.1.10 ansible_user=root

[k3s_server]
k3s-server ansible_host=192.168.1.21

[k3s_gpu]
gpu-node ansible_host=192.168.1.22

[k3s:children]
k3s_server
k3s_gpu

[vms:children]
bastion
k3s_server
k3s_gpu

[vms:vars]
ansible_user=admin
