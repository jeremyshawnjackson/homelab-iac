---
# Vendor-prefixed: the NodeRestriction admission plugin forbids a kubelet from
# labelling itself into the node-role.kubernetes.io/ namespace.
gpu_label_key: nvidia.com/gpu.present
gpu_label: nvidia.com/gpu.present=true

# Keeps general workloads off the GPU node. Anything that wants this hardware
# declares a toleration, which is also how it ends up being scheduled here.
gpu_taint_key: nvidia.com/gpu
gpu_taint: nvidia.com/gpu=present:NoSchedule
