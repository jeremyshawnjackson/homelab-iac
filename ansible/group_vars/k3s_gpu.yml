---
# Vendor-prefixed: the NodeRestriction admission plugin forbids a kubelet from
# labelling itself into the node-role.kubernetes.io/ namespace.
gpu_label_key: nvidia.com/gpu.present
gpu_label: nvidia.com/gpu.present=true

# Keeps general workloads off the GPU node. Anything that wants this hardware
# declares a toleration, which is also how it ends up being scheduled here.
gpu_taint_key: nvidia.com/gpu
gpu_taint: nvidia.com/gpu=present:NoSchedule

# The model library disk. Terraform attaches it as a bare 200 GB block device;
# roles/model_storage partitions, formats and mounts it. The GPT partition name
# is the stable handle: /dev/sdb is whatever the kernel enumerated this boot.
model_disk_size_gb: 200
model_partlabel: modellib
model_library_path: /var/lib/models

# One directory per consumer, each exported as its own PersistentVolume.
# vLLM and llama.cpp share the Hugging Face cache; Ollama keeps its own blob
# store, because it distributes models through its own registry rather than
# from Hugging Face.
model_library_dirs:
  - ollama
  - huggingface

# Debian's own nvidia-driver is too old for current runtimes, so the driver
# comes from NVIDIA's repository for this distribution.
cuda_repo_uri: 'https://developer.download.nvidia.com/compute/cuda/repos/debian12/x86_64'

# Pinned because the GPU Operator runs with driver.enabled=false, so this
# driver is what its validator checks. NVIDIA's repository ships new drivers
# regularly and an unpinned node drifts to a version nobody chose.
nvidia_driver_version: '615.71.10-1'

# The container toolkit generates the CDI spec that tells containerd which
# device nodes and driver libraries to inject into a container.
nvidia_toolkit_version: '1.20.1-1'
