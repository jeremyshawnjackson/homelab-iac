[defaults]
inventory          = inventory.ini
roles_path         = roles
interpreter_python = /usr/bin/python3
stdout_callback    = default
result_format      = yaml
callbacks_enabled  = ansible.posix.profile_tasks
retry_files_enabled = False
forks              = 10

# host_group_vars is Ansible's own group_vars/host_vars loader and must be
# listed explicitly once this setting is set at all, or it stops loading.
# community.sops.sops adds the same thing for group_vars/*.sops.yml, so an
# encrypted vars file is decrypted on use and never has a plaintext twin on
# disk for something to read or commit by accident.
vars_plugins_enabled = host_group_vars, community.sops.sops

[ssh_connection]
# accept-new trusts a host the first time, but still refuses a CHANGED key.
# A rebuilt VM on the same IP is a changed key: that failure is the point.
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=known_hosts
pipelining = True
