---
- name: k3s control plane
  hosts: k3s_server
  become: true
  roles:
    - k3s_server

- name: Control node tooling
  hosts: bastion
  become: true
  roles:
    - kubectl

- name: k3s GPU node
  hosts: k3s_gpu
  become: true
  roles:
    # The model library is mounted before the kubelet can schedule anything
    # that expects to find it.
    - model_storage
    - k3s_agent
