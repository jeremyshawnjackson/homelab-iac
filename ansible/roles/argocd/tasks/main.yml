---
# Argo CD is the one thing that cannot manage itself into existence. This
# role is the deliberate boundary between push and pull: everything after it
# arrives through Git.

- name: Create the Argo CD namespace
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl create namespace {{ argocd_namespace }} --dry-run=client -o yaml \
        | kubectl apply -f -
    executable: /bin/bash
  register: argocd_ns
  changed_when: "'created' in argocd_ns.stdout"

# Pinned to a release tag: an unpinned install means a rebuild gets whatever
# shipped since, which is the problem GitOps is supposed to solve.
#
# Server-side apply is required, not preferred: client-side apply stores a
# copy of the manifest in an annotation, and the ApplicationSet CRD is larger
# than the 256 KiB annotation limit. --force-conflicts takes field ownership
# from any manager that applied these objects before.
#
# Server-side apply reports every object as "serverside-applied" whether or
# not anything changed, so Ansible cannot detect drift here. The apply itself
# is idempotent; only the reporting is lost.
- name: Install Argo CD
  ansible.builtin.command: >
    kubectl apply -n {{ argocd_namespace }}
    --server-side --force-conflicts
    -f {{ argocd_manifest_url }}
  changed_when: false

# The manifest creates the CRDs and the controllers that watch them in a
# single apply, and nothing orders the two. A controller that calls the API
# server for a kind that is not established yet retries for the duration of
# controller-runtime's cache-sync deadline and then exits non-zero, which the
# kubelet sees as a crash loop. Blocking here removes the race.
- name: Wait for the Argo CD CRDs to be established
  ansible.builtin.command: >
    kubectl wait --for condition=established --timeout=120s
    crd/{{ item }}
  loop: "{{ argocd_crds }}"
  changed_when: false

# rollout status returns when a workload reports its replicas available, which
# is a weaker claim than "healthy": a pod whose readiness probe passes before
# it fails later still counts as available here. This catches a component that
# never starts. One that starts and then dies gets past it, and detecting that
# is alerting's job rather than a playbook's.
- name: Wait for the Argo CD deployments to roll out
  ansible.builtin.command: >
    kubectl -n {{ argocd_namespace }} rollout status
    deployment/{{ item }} --timeout=300s
  loop: "{{ argocd_deployments }}"
  changed_when: false

- name: Wait for the Argo CD application controller to roll out
  ansible.builtin.command: >
    kubectl -n {{ argocd_namespace }} rollout status
    statefulset/{{ item }} --timeout=300s
  loop: "{{ argocd_statefulsets }}"
  changed_when: false

# The only imperative object in the cluster's lifetime. Everything else
# descends from it.
- name: Apply the root Application
  ansible.builtin.command: >
    kubectl apply -f {{ playbook_dir }}/../kubernetes/bootstrap/root-app.yaml
  register: argocd_root
  changed_when: "'created' in argocd_root.stdout or 'configured' in argocd_root.stdout"
